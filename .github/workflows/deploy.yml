name: test-and-deploy

# GitHub only runs the tests. The server watches this repository itself (deploy/auto-update.sh) and
# deploys a commit once the "test" job below is green, so no inbound SSH to the server is needed.
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
