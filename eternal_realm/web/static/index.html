<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e1330">
  <title>پنل مدیریت قلمرو جاودان</title>
  <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/icons.css">
</head>
<body>
  <div class="layout">
    <aside class="side" id="side">
      <div class="brand">
        <img src="/static/img/logo.svg" alt="" width="44" height="44">
        <div><b>قلمرو جاودان</b><small>پنل مدیریت بازی</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="grow"></div>
      <div class="side-foot">
        <div class="who"><span class="live"></span><span id="me">در حال اتصال...</span></div>
        <button class="btn ghost" id="logout"><i class="ic ic-log-out"></i>خروج از پنل</button>
      </div>
    </aside>

    <div class="content">
      <header class="top">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="منو"><i class="ic ic-menu"></i></button>
        <h1 class="title" id="pageTitle"></h1>
        <div class="grow"></div>
        <button class="search-btn" id="searchBtn" aria-label="جستجو">
          <i class="ic ic-search"></i><span class="t">جستجو و دستورها...</span><kbd>Ctrl K</kbd>
        </button>
        <button class="icon-btn" id="refreshBtn" aria-label="تازه‌سازی" title="تازه‌سازی"><i class="ic ic-refresh-cw"></i></button>
        <button class="icon-btn" id="themeBtn" aria-label="تغییر تم" title="تغییر تم"><i class="ic ic-moon"></i></button>
      </header>
      <main class="main view" id="main"></main>
    </div>
  </div>

  <nav class="bottombar" id="bottom"></nav>
  <div class="overlay" id="overlay"></div>
  <aside class="sheet" id="sheet" aria-live="polite"></aside>
  <div class="toasts" id="toasts"></div>
  <div id="layer"></div>
  <script src="/static/app.js"></script>
</body>
</html>
