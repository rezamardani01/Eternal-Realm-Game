# قلمرو جاودان (Eternal Realm) - فایل تنظیمات
# این فایل را با نام config.toml کپی کنید و مقادیر را پر کنید.
# فایل config.toml در گیت نادیده گرفته می‌شود و هرگز نباید منتشر شود.

[bot]
# توکن ربات از @botfather بله
token = ""
# شناسه عددی مالک ربات (دسترسی کامل به پنل مدیریت)
owner_id = 0
# شناسه عددی مدیران اضافه (اختیاری)
admin_ids = []

[links]
# دکمه‌های «گروه ما» و «کانال ما» در منوی خصوصی ربات (خالی = دکمه نمایش داده نمی‌شود)
group = ""
channel = ""

[web]
# پنل مدیریت وب. ورود فقط با لینک یک‌بارمصرفی است که ربات برای مدیر می‌فرستد («پنل وب»)
enabled = false
host = "0.0.0.0"
port = 8080
# آدرس عمومی که در لینک ورود می‌آید، مثلاً http://195.177.255.161:8080
public_url = ""

[database]
path = "data/game.db"

[payments]
# خرید با کیف پول بله. برای تست از توکن آزمایشی استفاده کنید:
# WALLET-TEST-1111111111111111
enabled = true
provider_token = "WALLET-TEST-1111111111111111"

# برای تغییر ضرایب بازی، مقادیر زیر را باز کنید (همه اختیاری‌اند)
# [balance]
# max_level = 100
# energy_regen_seconds = 90
# duel_turn_seconds = 90
# transfer_daily_limit = 50000

# برای تغییر دستورات فارسی گروه، لیست جایگزین بدهید
# [commands]
# fish = ["ماهیگیری", "ماهی", "برو ماهی بگیر"]
